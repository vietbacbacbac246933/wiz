<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word → ZIP đề thi</title>
<link rel="stylesheet" href="/katex/katex.min.css">
<style>
:root{
  --bg:#eef2f8;--card:#fff;--ink:#172033;--muted:#5b6577;--line:#dbe2ee;
  --brand:#4338ca;--brand-soft:#eef0ff;--ok:#15803d;--ok-soft:#e8f7ee;
  --bad:#b91c1c;--bad-soft:#fdeaea;--warn:#b45309;--warn-soft:#fff6e5;
  --shadow:0 10px 30px rgba(23,32,51,.08)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:900px;margin:0 auto;padding:24px 16px 96px}
h1{font-size:1.5rem;margin:0 0 4px}
p{margin:.4em 0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-top:16px}
.drop{border:2px dashed #b9c4d8;border-radius:14px;padding:28px 16px;text-align:center;background:#f8fafd;cursor:pointer;transition:.15s}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop strong{display:block;font-size:1.05rem;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.row > label{flex:1 1 160px}
label{display:block;font-size:.86rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;color:var(--ink);background:#fff;width:100%}
textarea{min-height:64px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;display:none}
.status.show{display:block}
.status.ok{background:var(--ok-soft);color:#166534}
.status.err{background:var(--bad-soft);color:var(--bad)}
.status.info{background:var(--brand-soft);color:#3730a3}
.summary{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.92rem}
.summary b{font-size:1.05rem}
.chip{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.q{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:#fff}
.q.excluded{opacity:.55}
.q-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:8px}
.q-head .num{font-weight:800;color:var(--brand)}
.q-head label{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--ink)}
.q-head input[type=number]{width:74px}
[contenteditable]{border:1px solid transparent;border-radius:8px;padding:5px 7px;outline:none}
[contenteditable]:focus{border-color:var(--brand);background:#fbfbff}
.q-text{font-weight:600;background:#f7f9fc;border-color:var(--line)}
.opts{margin-top:8px;display:grid;gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.opt > input{margin-top:6px;flex:0 0 auto}
.opt .letter{font-weight:800;color:var(--muted);flex:0 0 auto;padding-top:3px}
.opt [contenteditable]{flex:1;background:#fbfcfe;border-color:var(--line)}
.tf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.preview{margin-top:8px;padding:8px 10px;border-left:3px solid var(--brand-soft);background:#fafbff;border-radius:0 8px 8px 0;font-size:.95rem}
.preview img{max-width:100%;height:auto}
.preview .math{display:block;margin:4px 0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.spacer{flex:1}
@media(max-width:560px){#app{padding:16px 10px 80px}.card{padding:14px}}
</style>
</head>
<body>
<div id="app">
  <h1>Chuyển đề Word thành gói ZIP</h1>
  <p class="muted">Nạp file <b>.docx</b>, kiểm tra câu hỏi, rồi tải về gói ZIP chứa file HTML tự chạy (không cần mạng).</p>

  <section class="card">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Chọn hoặc kéo thả file Word">
      <strong>Kéo thả file .docx vào đây</strong>
      <span class="muted">hoặc bấm để chọn file (tối đa 15 MB)</span>
      <input type="file" id="file" accept=".docx" hidden>
    </div>
    <div class="actions">
      <button id="extract" disabled>Trích xuất lại</button>
      <span id="fileInfo" class="muted"></span>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </section>

  <section class="card" id="result" hidden>
    <div class="summary">
      <span><b id="count">0</b> câu</span>
      <span><span class="chip warn" id="reviewCount">0 cần kiểm tra</span></span>
      <span class="muted" id="sourceName"></span>
    </div>
    <div id="importWarnings" class="status info" role="status"></div>

    <h2 style="font-size:1.05rem;margin:18px 0 6px">Thông tin đề</h2>
    <div class="row">
      <label>Tiêu đề đề thi<input type="text" id="title" value="Bài kiểm tra"></label>
      <label>Môn học<input type="text" id="subject" placeholder="Ví dụ: Toán"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <label>Chế độ<select id="mode"><option value="practice">Ôn tập</option><option value="exam">Kiểm tra</option></select></label>
      <label>Thời gian (phút)<input type="number" id="minutes" min="0" max="600" value="45"></label>
      <label>Số lượt (ôn tập)<input type="number" id="attempts" min="0" max="99" value="0"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <label style="display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)"><input type="checkbox" id="shuffle" checked> Trộn câu hỏi</label>
      <label style="display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)"><input type="checkbox" id="showAnswers" checked> Hiện đáp án</label>
      <label style="display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)"><input type="checkbox" id="instant"> Báo đúng/sai ngay</label>
    </div>

    <div class="toolbar">
      <button class="ghost" id="toggleAll" type="button">Bỏ chọn tất cả</button>
      <span class="spacer"></span>
      <button id="export" type="button">Tải file ZIP</button>
    </div>

    <div class="filters" role="group" aria-label="Lọc câu hỏi">
      <button class="pill" type="button" data-filter="all" aria-pressed="true">Tất cả (<span data-count="all">0</span>)</button>
      <button class="pill" type="button" data-filter="answered" aria-pressed="false">Có đáp án (<span data-count="answered">0</span>)</button>
      <button class="pill" type="button" data-filter="review" aria-pressed="false">Cần kiểm tra (<span data-count="review">0</span>)</button>
    </div>

    <div id="list"></div>
  </section>
</div>

<script src="/katex/katex.min.js"></script>
<script src="/katex/contrib/auto-render.min.js"></script>
<script>
(function () {
  'use strict';

  var state = { file: null, data: null, questions: [], pool: {}, reverse: {}, filter: 'all' };
  var $ = function (id) { return document.getElementById(id); };
  var list = $('list');

  function setStatus(msg, kind) {
    var el = $('status');
    el.textContent = msg;
    el.className = 'status show ' + (kind || 'info');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderTokens(html) {
    return String(html == null ? '' : html).replace(/\[\[IMG:(\d+)\]\]/g, function (m, n) {
      return state.pool[n] ? '<img src="' + state.pool[n] + '" alt="">' : '';
    });
  }

  function toTokens(html) {
    return String(html == null ? '' : html)
      .replace(/<img\b[^>]*\bsrc\s*=\s*["']([^"']*)["'][^>]*>/gi, function (m, src) {
        var token = state.reverse[src];
        return token == null ? m : '[[IMG:' + token + ']]';
      });
  }

  function mathPreview(el) {
    if (!window.renderMathInElement) return;
    try {
      window.renderMathInElement(el, {
        delimiters: [
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false
      });
    } catch (e) { /* bo qua loi cong thuc */ }
  }

  function previewMarkup(html) {
    var has = /\[\[IMG:/.test(html) || /\\[\(\[]/.test(html);
    return '<div class="preview"' + (has ? '' : ' hidden') + '>' + renderTokens(html) + '</div>';
  }

  function typeLabel(type) {
    return type === 'multi' ? 'Nhiều đáp án'
      : type === 'truefalse' ? 'Đúng/Sai'
      : type === 'shortanswer' ? 'Trả lời ngắn' : 'Một đáp án';
  }

  function isReview(q) {
    return !!(q.needsReview || q.correct === null || q.correct === -1);
  }

  function badge(q) {
    if (isReview(q)) {
      return '<span class="chip warn">Cần kiểm tra</span>';
    }
    return '';
  }

  function optionRow(q, qi, oi, text) {
    var letter = String.fromCharCode(65 + oi);
    var control;
    if (q.type === 'single') {
      control = '<input type="radio" name="single-' + qi + '" data-single="' + qi + '" value="' + oi + '"' +
        (q.correct === oi ? ' checked' : '') + '>';
    } else if (q.type === 'multi') {
      control = '<input type="checkbox" data-multi="' + qi + '" value="' + oi + '"' +
        (Array.isArray(q.correctList) && q.correctList.indexOf(oi) >= 0 ? ' checked' : '') + '>';
    } else if (q.type === 'truefalse') {
      var v = Array.isArray(q.correctTF) ? q.correctTF[oi] : null;
      control = '<select data-tf="' + qi + '" data-oi="' + oi + '" style="width:auto">' +
        '<option value="">—</option>' +
        '<option value="true"' + (v === true ? ' selected' : '') + '>Đúng</option>' +
        '<option value="false"' + (v === false ? ' selected' : '') + '>Sai</option></select>';
    } else {
      control = '<span style="width:18px"></span>';
    }
    return '<div class="opt">' + control +
      '<span class="letter">' + letter + '.</span>' +
      '<div contenteditable data-opt="' + qi + '" data-oi="' + oi + '">' + renderTokens(text) + '</div>' +
      '</div>';
  }

  function questionCard(q, qi) {
    var opts = '';
    if (q.type !== 'shortanswer') {
      (q.options || []).forEach(function (text, oi) { opts += optionRow(q, qi, oi, text); });
    } else {
      opts = '<div class="tf"><label>Đáp án trả lời ngắn</label>' +
        '<input type="text" data-short="' + qi + '" value="' + escapeHtml(q.correctAnswer || '') + '" style="max-width:240px"></div>';
    }
    return '<article class="q' + (q.include === false ? ' excluded' : '') + '" data-q="' + qi + '">' +
      '<div class="q-head">' +
        '<span class="num">Câu ' + (q.importNumber || (qi + 1)) + '</span>' +
        '<span class="chip ok">' + typeLabel(q.type) + '</span>' + badge(q) +
        '<label><input type="checkbox" data-inc="' + qi + '"' + (q.include === false ? '' : ' checked') + '> Đưa vào đề</label>' +
        '<label style="margin-left:auto">Điểm <input type="number" min="0.1" max="100" step="0.1" data-points="' + qi + '" value="' + (q.points || 1) + '"></label>' +
      '</div>' +
      '<div class="q-text" contenteditable data-question="' + qi + '">' + renderTokens(q.question) + '</div>' +
      previewMarkup(q.question) +
      '<div class="opts">' + opts + '</div>' +
      '</article>';
  }

  function renderList() {
    var items = state.questions.map(function (q, i) { return { q: q, i: i }; });
    var counts = { all: items.length, answered: 0, review: 0 };
    items.forEach(function (it) {
      if (isReview(it.q)) counts.review++;
      else counts.answered++;
    });
    Object.keys(counts).forEach(function (key) {
      var el = document.querySelector('[data-count="' + key + '"]');
      if (el) el.textContent = counts[key];
    });
    var shown = items.filter(function (it) {
      if (state.filter === 'answered') return !isReview(it.q);
      if (state.filter === 'review') return isReview(it.q);
      return true;
    });
    list.innerHTML = shown.length
      ? shown.map(function (it) { return questionCard(it.q, it.i); }).join('')
      : '<p class="muted" style="margin-top:16px">' +
        (state.filter === 'review' ? 'Không có câu nào cần kiểm tra.' : 'Không có câu nào có đáp án.') + '</p>';
    list.querySelectorAll('.preview').forEach(mathPreview);
  }

  function tokenizeHtml(html) {
    return toTokens(html);
  }

  function onEdit(e) {
    var t = e.target;
    var qi;
    if (t.dataset.question != null) {
      qi = +t.dataset.question;
      state.questions[qi].question = tokenizeHtml(t.innerHTML);
      refreshPreview(t);
    } else if (t.dataset.opt != null) {
      qi = +t.dataset.opt;
      state.questions[qi].options[+t.dataset.oi] = tokenizeHtml(t.innerHTML);
    } else if (t.dataset.inc != null) {
      qi = +t.dataset.inc;
      state.questions[qi].include = t.checked;
      t.closest('.q').classList.toggle('excluded', !t.checked);
    } else if (t.dataset.points != null) {
      state.questions[+t.dataset.points].points = Number(t.value);
    } else if (t.dataset.single != null) {
      state.questions[+t.dataset.single].correct = +t.value;
    } else if (t.dataset.multi != null) {
      qi = +t.dataset.multi;
      var listVals = Array.prototype.slice.call(
        list.querySelectorAll('[data-multi="' + qi + '"]:checked')
      ).map(function (x) { return +x.value; });
      state.questions[qi].correctList = listVals;
      state.questions[qi].correct = listVals.length ? listVals[0] : null;
    } else if (t.dataset.tf != null) {
      qi = +t.dataset.tf;
      var oi = +t.dataset.oi;
      var arr = state.questions[qi].correctTF || [];
      arr[oi] = t.value === '' ? null : t.value === 'true';
      state.questions[qi].correctTF = arr;
    } else if (t.dataset.short != null) {
      state.questions[+t.dataset.short].correctAnswer = t.value;
    }
  }

  function refreshPreview(el) {
    var card = el.closest('.q');
    if (!card) return;
    var old = card.querySelector('.preview');
    var html = el.innerHTML;
    var has = /\[\[IMG:/.test(html) || /\\[\(\[]/.test(html);
    var box = document.createElement('div');
    box.className = 'preview';
    box.innerHTML = renderTokens(html);
    box.hidden = !has;
    mathPreview(box);
    if (old) old.replaceWith(box);
    else el.after(box);
  }

  list.addEventListener('input', onEdit);
  list.addEventListener('change', onEdit);

  function readFile(file) {
    if (!file) return;
    if (!/\.docx$/i.test(file.name)) {
      setStatus('Chỉ nhận file Word (.docx).', 'err');
      return;
    }
    state.file = file;
    $('fileInfo').textContent = file.name + ' (' + (file.size / 1024 / 1024).toFixed(2) + ' MB)';
    $('extract').disabled = false;
    runExtract();
  }

  $('drop').addEventListener('click', function () { $('file').click(); });
  $('drop').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); }
  });
  ['dragenter', 'dragover'].forEach(function (name) {
    $('drop').addEventListener(name, function (e) { e.preventDefault(); $('drop').classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (name) {
    $('drop').addEventListener(name, function (e) { e.preventDefault(); $('drop').classList.remove('over'); });
  });
  $('drop').addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    readFile(f);
  });
  $('file').addEventListener('change', function () { readFile(this.files[0]); });

  function runExtract() {
    if (!state.file) return;
    var btn = $('extract');
    var fd = new FormData();
    fd.append('file', state.file);
    btn.disabled = true;
    setStatus('Đang trích xuất...', 'info');
    fetch('/api/extract', { method: 'POST', body: fd })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (!json.success) throw new Error(json.error || 'Không trích xuất được.');
        state.data = json;
        state.pool = json.imagePool || {};
        state.reverse = {};
        Object.keys(state.pool).forEach(function (k) { state.reverse[state.pool[k]] = k; });
        state.questions = json.questions.map(function (q) {
          q.include = true;
          if (q.type === 'truefalse' && !Array.isArray(q.correctTF)) q.correctTF = [];
          return q;
        });
        $('result').hidden = false;
        $('count').textContent = state.questions.length;
        $('reviewCount').textContent = json.needsReview + ' cần kiểm tra';
        $('reviewCount').className = 'chip ' + (json.needsReview ? 'warn' : 'ok');
        $('sourceName').textContent = json.source && json.source.docx ? json.source.docx : '';
        var tableWarnings = (json.answerTables && json.answerTables.warnings) || [];
        var warnEl = $('importWarnings');
        warnEl.textContent = tableWarnings.join(' ');
        warnEl.className = 'status info' + (tableWarnings.length ? ' show' : '');
        renderList();
        setStatus('Trích xuất xong ' + json.count + ' câu. Kiểm tra và sửa nếu cần.', 'ok');
        $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
      })
      .catch(function (err) { setStatus(err.message, 'err'); })
      .then(function () { btn.disabled = false; });
  }

  $('extract').addEventListener('click', runExtract);

  document.querySelectorAll('[data-filter]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.filter = btn.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      renderList();
    });
  });

  $('mode').addEventListener('change', function () {
    var practice = this.value === 'practice';
    $('minutes').disabled = practice;
    $('attempts').disabled = !practice;
  });
  $('mode').dispatchEvent(new Event('change'));

  var allIncluded = true;
  $('toggleAll').addEventListener('click', function () {
    allIncluded = !allIncluded;
    state.questions.forEach(function (q) { q.include = allIncluded; });
    this.textContent = allIncluded ? 'Bỏ chọn tất cả' : 'Chọn tất cả';
    renderList();
  });

  $('export').addEventListener('click', function () {
    if (!state.data) return;
    var questions = state.questions.filter(function (q) { return q.include !== false; });
    if (!questions.length) {
      setStatus('Chưa chọn câu hỏi nào để xuất.', 'err');
      return;
    }
    var payload = {
      sessionId: state.data.sessionId,
      title: $('title').value,
      subject: $('subject').value,
      questions: questions,
      settings: {
        mode: $('mode').value,
        minutes: parseInt($('minutes').value, 10) || 0,
        attempts: parseInt($('attempts').value, 10) || 0,
        shuffle: $('shuffle').checked,
        showAnswers: $('showAnswers').checked,
        instant: $('instant').checked
      }
    };
    var btn = this;
    btn.disabled = true;
    setStatus('Đang tạo file ZIP...', 'info');
    fetch('/api/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        if (!res.ok) return res.json().then(function (j) { throw new Error(j.error || 'Không xuất được file.'); });
        var name = /filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '');
        return res.blob().then(function (blob) {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = name ? name[1] : 'de-thi.zip';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
          setStatus('Đã tải file ZIP. Bên trong là file HTML tự chạy kèm manifest, service worker và icon.', 'ok');
        });
      })
      .catch(function (err) { setStatus(err.message, 'err'); })
      .then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
